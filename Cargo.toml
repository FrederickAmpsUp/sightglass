[package]
authors = ["Frederick Ziola <frederick.ziola@gmail.com>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "sightglass"
description = "a puzzle/horror game based around manipulating light transport"
version = "0.1.0"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smol = "2.0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "30.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
gloo-net = "0.8.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}

[dependencies]
anyhow = "1.0.105"
aseprite-io = "0.2.0"
bytemuck = "1.25.2"
clap = { version = "4.3.14", features = ["derive"] }
env_logger = "0.11.12"
etagere = "0.3.0"
futures = "0.3.34"
glam = { version = "0.34.3", features = ["bytemuck", "serde"] }
log = "0.4.35"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1.1.0"
wesl = "0.4.2"
wgpu = "30.0.2"
winit = "0.30.13"

[build-dependencies]
copy_to_output = "2.2.0"
glob = "0.3.4"
wesl = "0.4.2"
